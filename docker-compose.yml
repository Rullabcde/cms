services:
  postgres:
    image: postgres:16-alpine3.21
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - cms-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: '1.0'
    #     reservations:
    #       memory: 128M
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine3.21
    container_name: cms-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-cms-redis-secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - cms-net
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-cms-redis-secret}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    # deploy:
    #   resources:
    #     limits:
    #       memory: 300M
    #       cpus: '0.5'
    #     reservations:
    #       memory: 64M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  cms-backend:
    image: rullabcd/cms-backend:latest
    container_name: cms-backend
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cms-redis-secret}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRY_MINUTES: ${ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-7}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms-net
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M
    #       cpus: '1.0'
    #     reservations:
    #       memory: 64M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  cms-frontend:
    image: rullabcd/cms-frontend:latest
    container_name: cms-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
    depends_on:
      - cms-backend
    networks:
      - cms-net
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: '1.0'
    #     reservations:
    #       memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  cms-net:
    driver: bridge
    name: cms-net

volumes:
  pg-data:
    driver: local
    name: pg-data
  redis-data:
    driver: local
    name: redis-data
